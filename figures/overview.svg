<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="920" viewBox="0 0 1400 920">
<title>EnvOpt: improving the typical data-centric research workflow</title>
<desc>Data-centric RSI links a researcher, training data, and a model through trajectories and feedback. A typical native-Codex research workflow analyzes trajectories, generates data, and submits data. Associated challenges are limited behavior coverage, narrow or non-executable data, and weak feedback-to-data links. EnvOpt addresses these through traceable merge analysis, a target-grounded generation pipeline, and a target-linked environment pool. Challenges are design motivations, not quantified baseline results.</desc>
<defs>
<marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6.5 L1 12" fill="none" stroke="#527E71" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
