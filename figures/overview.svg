<g id="chip"><g stroke="#93ACA0" stroke-width="2.3" stroke-linecap="round"><path d="M-25-46 V-35 M0-46 V-35 M25-46 V-35 M-25 35 V46 M0 35 V46 M25 35 V46 M-46-25 H-35 M-46 0 H-35 M-46 25 H-35 M35-25 H46 M35 0 H46 M35 25 H46"/></g><rect x="-35" y="-35" width="70" height="70" rx="10" fill="#F1F6F1" stroke="#729285" stroke-width="2"/><path d="M-19-12 L1-24 L20-7 L13 20 L-13 18 Z M-19-12 L13 20 M1-24 L-13 18" stroke="#8FA797" stroke-width="2" fill="none"/><g fill="#648B77"><circle cx="-19" cy="-12" r="4"/><circle cx="1" cy="-24" r="4"/><circle cx="20" cy="-7" r="4"/><circle cx="13" cy="20" r="4"/><circle cx="-13" cy="18" r="4"/></g></g>
