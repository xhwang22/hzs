<g id="page" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M0 0 H32 L47 15 V62 H0 Z" fill="white"/><path d="M32 0 V15 H47" fill="#F0F4EF"/><path d="M9 29 H37 M9 40 H34 M9 51 H26" fill="none" stroke-width="2.5" stroke-linecap="round"/></g>
