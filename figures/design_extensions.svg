<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="870" viewBox="0 0 1400 870">
  <title>EnvOpt methodology extensions proposed for investigation</title>
  <desc>Four proposed directions: preserve the target decision when changing workload; allocate useful coverage; replay known counterexamples; distinguish policy variation from simulator and grader noise. These are research candidates, not claims about the implemented system or completed experiments.</desc>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#8E9CAB"/></marker>
    <g id="lock" fill="none" stroke="#438579" stroke-width="3"><path d="M-12-2 V-14 Q-12-30 0-30 Q12-30 12-14 V-2"/><rect x="-21" y="-2" width="42" height="32" rx="6" fill="#F5FBF8"/><circle cy="12" r="3" fill="#438579"/></g>
    <g id="doc" fill="white" stroke="currentColor" stroke-width="2.5"><rect x="-20" y="-28" width="40" height="56" rx="5"/><path d="M-10-13 H10 M-10-2 H10 M-10 9 H3" fill="none" stroke-linecap="round"/></g>
  </defs>
  <rect width="1400" height="870" fill="white"/>
  <g font-family="Liberation Sans, Arial, sans-serif" fill="#2E4458">
    <text x="42" y="50" font-size="35" font-weight="700">Design candidates for stronger iterative evolution</text>
    <rect x="42" y="73" width="512" height="41" rx="10" fill="#FAEEE3"/><text x="60" y="101" font-size="24" font-weight="700" fill="#A37D56">PROPOSED · not implemented or evaluated</text>
    <!-- Priorities are visually separate from supporting audit designs. -->
    <rect x="42" y="148" width="638" height="310" rx="20" fill="#F7FAF8" stroke="#B8D4C5" stroke-width="2" stroke-dasharray="9 6"/>
    <circle cx="80" cy="191" r="20" fill="#DAEBE1"/><text x="80" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#548772">A</text>
    <text x="116" y="201" font-size="31" font-weight="700">Preserve the target decision</text>
    <text x="116" y="235" font-size="24" fill="#71917F">Priority 1 · strengthen workload calibration</text>
    <g transform="translate(146 293)" color="#94B3A3"><use href="#doc" transform="translate(-22 0) rotate(-10)"/><use href="#doc" transform="translate(5 0) rotate(5)"/></g>
    <path d="M203 292 H301" stroke="#8E9CAB" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <use href="#doc" transform="translate(351 292)" color="#77A18A"/>
    <use href="#lock" transform="translate(548 293)"/>
    <text x="146" y="353" text-anchor="middle" font-size="25" fill="#799080">More workload</text><text x="351" y="353" text-anchor="middle" font-size="25" fill="#799080">Less workload</text><text x="548" y="353" text-anchor="middle" font-size="25" fill="#54836B">Same decision</text>
    <text x="70" y="402" font-size="25">Keep required information and real actions.</text>
    <text x="70" y="438" font-size="23" fill="#86978D">Test: mechanism retention + held-out transfer</text>

    <rect x="718" y="148" width="638" height="310" rx="20" fill="#F7F8FC" stroke="#C2CCE0" stroke-width="2" stroke-dasharray="9 6"/>
    <circle cx="756" cy="191" r="20" fill="#E0E7F3"/><text x="756" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#6C85AC">B</text>
    <text x="792" y="201" font-size="31" font-weight="700">Allocate useful coverage</text>
    <text x="792" y="235" font-size="24" fill="#7D8BA8">Priority 2 · strengthen portfolio-level signal</text>
    <g transform="translate(760 270)">
      <rect width="133" height="30" rx="7" fill="#D8E4F4"/><rect x="143" width="133" height="30" rx="7" fill="#DCEEE7"/><rect x="286" width="133" height="30" rx="7" fill="#E7DFF0"/>
      <text x="66.5" y="58" text-anchor="middle" font-size="24" fill="#7188A7">Coverage</text><text x="209.5" y="58" text-anchor="middle" font-size="24" fill="#648E7B">Signal</text><text x="352.5" y="58" text-anchor="middle" font-size="24" fill="#8A7B9D">Cost</text>
      <path d="M66.5 70 V82 H352.5 V70 M209.5 82 V96" fill="none" stroke="#9DABB9" stroke-width="2"/>
      <text x="468" y="23" text-anchor="middle" font-size="27" fill="#899AAA">α</text>
    </g>
    <text x="746" y="402" font-size="25">Probe by mechanism and task variant.</text>
    <text x="746" y="438" font-size="23" fill="#8893A6">Test: useful groups + transfer per total cost</text>

    <rect x="42" y="501" width="638" height="285" rx="20" fill="#FCFAF7" stroke="#DDCDB8" stroke-width="2" stroke-dasharray="9 6"/>
    <circle cx="80" cy="544" r="20" fill="#EFE5D6"/><text x="80" y="553" text-anchor="middle" font-size="26" font-weight="700" fill="#9C805C">C</text>
    <text x="116" y="554" font-size="31" font-weight="700">Retain counterexamples</text>
    <text x="116" y="588" font-size="24" fill="#A08F78">Support · make semantic repairs persistent</text>
    <g transform="translate(142 647)" color="#B09A7C"><use href="#doc"/><path d="M-8-5 L8 11 M8-5 L-8 11" stroke="#B08274" stroke-width="3.5"/></g>
    <path d="M199 648 H454" stroke="#9DA8B3" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
    <text x="326" y="630" text-anchor="middle" font-size="24" fill="#A38C6E">replay after edits</text>
    <g transform="translate(509 647)" color="#9DAD97"><use href="#doc"/><path d="M-10 1 L-2 10 L13-9" stroke="#729686" stroke-width="3.5" fill="none"/></g>
    <text x="70" y="718" font-size="25">Replay known defects; keep diagnostics off-train.</text>
    <text x="70" y="755" font-size="23" fill="#A0917D">Test: recurrence of previously confirmed defects</text>

    <rect x="718" y="501" width="638" height="285" rx="20" fill="#FAF7FB" stroke="#D7C8DF" stroke-width="2" stroke-dasharray="9 6"/>
    <circle cx="756" cy="544" r="20" fill="#EAE0EE"/><text x="756" y="553" text-anchor="middle" font-size="26" font-weight="700" fill="#9780A4">D</text>
    <text x="792" y="554" font-size="31" font-weight="700">Audit the source of variation</text>
    <text x="792" y="588" font-size="24" fill="#9B89A5">Support · distinguish policy signal from noise</text>
    <g font-size="25" text-anchor="middle"><rect x="760" y="621" width="141" height="49" rx="12" fill="#E4EBF5"/><text x="830.5" y="654" fill="#6F85A2">Policy</text><rect x="920" y="621" width="171" height="49" rx="12" fill="#E2EFE7"/><text x="1005.5" y="654" fill="#6B917D">Simulator</text><rect x="1110" y="621" width="184" height="49" rx="12" fill="#EEE4F0"/><text x="1202" y="654" fill="#967FA4">Grading</text></g>
    <text x="746" y="718" font-size="25">Hold task state fixed; check grading consistency.</text>
    <text x="746" y="755" font-size="23" fill="#9B8DA4">Test: stable task signal and diagnostic overhead</text>
    <text x="700" y="839" text-anchor="middle" font-size="24" fill="#83919D">A/B change the adaptation strategy. C/D make its feedback more trustworthy.</text>
  </g>
</svg>
